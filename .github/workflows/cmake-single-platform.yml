name: Windows x64 build and tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install offline texture build dependency
      run: python -m pip install Pillow

    - name: Cache pinned native dependencies
      id: dependencies
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/s2-deps
        key: windows-x64-native-v1-sdl3-3.4.16-bgfx-de08a608

    - name: Install pinned native dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      run: |
        $ErrorActionPreference = 'Stop'
        $dependencies = @(
          @{ Name = 'SDL3'; Url = 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-devel-3.4.16-VC.zip'; SHA256 = '1A784CB2A5C64D56FE7A62090FE9D242D9865F235E4EA9678F1A6BA4E693E7DE' },
          @{ Name = 'bgfx.cmake'; Url = 'https://github.com/bkaradzic/bgfx.cmake/archive/de08a6080b39994ab8a9eddb82e79e18bc3df7bd.zip' },
          @{ Name = 'bgfx'; Url = 'https://github.com/bkaradzic/bgfx/archive/81d81fba72c42d348c589514c774bbfe01e110fa.zip' },
          @{ Name = 'bimg'; Url = 'https://github.com/bkaradzic/bimg/archive/87aaad3ac882e741889fdd4263224e5d12c26f99.zip' },
          @{ Name = 'bx'; Url = 'https://github.com/bkaradzic/bx/archive/25315498841259323e18f549d1ad9d9aba6632cc.zip' }
        )
        foreach ($dependency in $dependencies) {
          $archive = Join-Path $env:RUNNER_TEMP ($dependency.Name + '.zip')
          $destination = Join-Path $env:RUNNER_TEMP ('s2-deps/' + $dependency.Name)
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Invoke-WebRequest -Uri $dependency.Url -OutFile $archive
          if ($dependency.SHA256 -and (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $dependency.SHA256) {
            throw ('Checksum mismatch: ' + $dependency.Name)
          }
          tar -xf $archive -C $destination --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw ('Extraction failed: ' + $dependency.Name) }
          Remove-Item -LiteralPath $archive
        }

    - name: Configure CMake
      run: >-
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        -DSDL3_DIR="$env:RUNNER_TEMP/s2-deps/SDL3/cmake"
        -DS2_BGFX_CMAKE_ROOT="$env:RUNNER_TEMP/s2-deps/bgfx.cmake"
        -DS2_BGFX_DIR="$env:RUNNER_TEMP/s2-deps/bgfx"
        -DS2_BIMG_DIR="$env:RUNNER_TEMP/s2-deps/bimg"
        -DS2_BX_DIR="$env:RUNNER_TEMP/s2-deps/bx"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

    - name: Test
      run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error --timeout 120 --parallel 4

    - name: Save test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-test-logs
        path: build/Testing/Temporary/*.log
        if-no-files-found: ignore
        retention-days: 7

